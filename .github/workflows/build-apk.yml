name: Build Android APK

# This workflow builds the Eswatini Cars WebView APK in the cloud.
# It can be triggered:
#   1. Manually from GitHub (Actions tab → "Build Android APK" → Run workflow)
#   2. Automatically when the Java code in android-apk/ changes
#
# The resulting APK is uploaded as a downloadable artifact. After the build
# completes (about 15-20 minutes), you can:
#   1. Go to the Actions tab on GitHub
#   2. Click the latest "Build Android APK" run
#   3. Scroll down to "Artifacts"
#   4. Download the APK to your phone
#   5. Install it (you may need to allow installs from unknown sources)
#
# No computer required — you can do this entirely from a phone browser.

on:
  workflow_dispatch:  # manual trigger from the Actions tab
  push:
    paths:
      - 'android-apk/**'  # auto-build when the APK code changes
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required for the softprops/action-gh-release step to create a release.
    # The default GITHUB_TOKEN has read-only permissions; this grants write
    # access to contents (so we can create tags + releases) and packages.
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Verify keystore is committed
        working-directory: android-apk
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "ERROR: app/release.keystore is missing from the repo"
            exit 1
          fi
          echo "Keystore present:"
          ls -lh app/release.keystore
          if keytool -list -keystore app/release.keystore -storepass eswatini123 >/dev/null 2>&1; then
            echo "✓ Keystore password is valid"
          else
            echo "ERROR: Keystore password is invalid"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        working-directory: android-apk
        run: chmod +x ./gradlew

      - name: Build production APK (signed release)
        working-directory: android-apk
        run: ./gradlew assembleProductionRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34

      - name: Build staging APK (signed release)
        working-directory: android-apk
        run: ./gradlew assembleStagingRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34

      - name: List built APKs (debug — show actual paths)
        working-directory: android-apk
        run: |
          echo "=== All APK files in build outputs ==="
          find . -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "=== Production release APK ==="
          ls -lh app/build/outputs/apk/production/release/*.apk 2>&1 || echo "PRODUCTION APK NOT FOUND"
          echo ""
          echo "=== Staging release APK ==="
          ls -lh app/build/outputs/apk/staging/release/*.apk 2>&1 || echo "STAGING APK NOT FOUND"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: Eswatini-Cars-Production-APK
          path: android-apk/app/build/outputs/apk/production/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: Eswatini-Cars-Staging-APK
          path: android-apk/app/build/outputs/apk/staging/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read version from build.gradle
        id: version
        working-directory: android-apk
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Publish production APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK_PATH="android-apk/app/build/outputs/apk/production/release/app-production-release.apk"
          
          echo "Creating release v$VERSION..."
          
          # Rename APK to a user-friendly name before uploading
          cp "$APK_PATH" "Eswatini-Cars.apk"
          
          # Delete existing release if it exists (in case of re-runs)
          gh release delete "v$VERSION" --yes 2>/dev/null || true
          
          # Create new release with the APK attached (named Eswatini-Cars.apk)
          gh release create "v$VERSION" "Eswatini-Cars.apk" \
            --title "Eswatini Cars v$VERSION" \
            --notes "## Eswatini Cars v$VERSION

          ### What's new
          - In-app update notifications (like Telegram)
          - Cache fix (no more stale data)
          - Zoom fix (text no longer enlarged)
          - Modern dialogs (toast notifications + styled AlertDialogs)
          - Google Sign-In fixed
          - Upload button fixed
          - Image auto-retry on broken images
          - Refresh option in hamburger menu
          - Daily database backup via email
          - Edit/delete for vehicle requests in admin dashboard

          ### Install
          1. Download the APK file below
          2. Tap it in your Downloads folder
          3. Allow installs from browser if Android prompts
          4. Open the app

          ### Direct download link (permanent, shareable)
          https://github.com/mlandvodlamini12-cloud/eswatini-cars/releases/latest/download/Eswatini-Cars.apk" \
            --latest
          
          echo "Release v$VERSION created successfully!"
