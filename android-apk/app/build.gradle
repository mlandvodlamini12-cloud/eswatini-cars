// Eswatini Cars — app module build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'sz.co.eswatinicars.app'
    compileSdk 34

    defaultConfig {
        // applicationId is now set per-flavor (see productFlavors below)
        minSdk 24          // Android 7.0 — covers ~98% of devices in Eswatini
        targetSdk 34       // required for Play Store submission
        versionCode 9
        versionName "1.1.0"
    }

    // === Product flavors — lets us build TWO APKs from the same source ===
    // production: the real app users install (sz.co.eswatinicars.app)
    // staging:    a separate test app (sz.co.eswatinicars.app.staging) that
    //             loads the Vercel staging URL. Different applicationId means
    //             it installs ALONGSIDE the production app — no overwrite.
    flavorDimensions "environment"
    productFlavors {
        production {
            dimension "environment"
            applicationId "sz.co.eswatinicars.app"
            // BuildConfig.LAUNCH_URL — read by MainActivity at runtime
            buildConfigField "String", "LAUNCH_URL", "\"https://eswatini-cars.vercel.app/\""
            // resValue generates a string resource that overrides strings.xml
            resValue "string", "app_name", "Eswatini Cars"
        }
        staging {
            dimension "environment"
            applicationId "sz.co.eswatinicars.app.staging"
            // Points at the Vercel preview deployment for the `staging` branch.
            // Every push to staging updates this URL — test the latest code here.
            buildConfigField "String", "LAUNCH_URL", "\"https://eswatini-cars-git-staging-eswatini-cars.vercel.app/\""
            resValue "string", "app_name", "EC [TEST]"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'

    // Google Play Services Auth — for GoogleSignInClient (account picker)
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Force a single Kotlin stdlib version — play-services-auth brings in
    // an old kotlin-stdlib-jdk7/jdk8 (1.6.21) that conflicts with the newer
    // 1.8.22 pulled in transitively, causing "Duplicate class" build errors.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }

    // WebView is part of the Android framework — no dependency needed
}
